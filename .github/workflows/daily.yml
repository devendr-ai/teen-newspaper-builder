name: Publish today's papers

# Papers are published by a Claude Code Routine at about 02:00 IST (see
# docs/PUBLISHING.md, "Publishing with Claude Code"), so this API pipeline runs
# only when started by hand. To make it the daily publisher again, add back:
#   schedule:
#     - cron: "15 11 * * *"     # 11:15 UTC = 4:15 am Pacific, 4:45 pm India
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Edition ids, comma-separated (blank = everything due today)"
        required: false
        default: ""
      dry_run:
        description: "Only list what's due and the estimated cost"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poppler (cover images)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg espeak-ng
      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Research, write and check today's papers
        continue-on-error: true          # a failed paper is skipped; the rest still publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YGC_DAILY_BUDGET: ${{ vars.YGC_DAILY_BUDGET || '15' }}
          YGC_MODEL: ${{ vars.YGC_MODEL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m ygc auto $ARGS

      - name: Save new issues
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions data
          if git diff --cached --quiet; then echo "Nothing new today."; exit 0; fi
          TODAY=$(date -u +%F)
          if [ "${{ vars.REVIEW_MODE }}" = "true" ]; then
            git checkout -b "papers-$TODAY"
            git commit -m "Papers for $TODAY"
            git push -u origin "papers-$TODAY"
            gh pr create --title "Papers for $TODAY" --body "Open the run summary for PDFs. Merge to publish; close to discard."
            echo "REVIEW_PENDING=1" >> "$GITHUB_ENV"
          else
            git commit -m "Papers for $TODAY"
            git push
          fi

      - name: Build the website
        if: github.event.inputs.dry_run != 'true' && env.REVIEW_PENDING != '1'
        run: python -m ygc site --out _site
      - name: Restore generated narration
        uses: actions/cache/restore@v4
        if: github.event.inputs.dry_run != 'true' && env.REVIEW_PENDING != '1'
        with:
          path: .cache/narration
          key: narration-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: narration-v1-${{ runner.os }}-
      - name: Install free narration engine
        if: github.event.inputs.dry_run != 'true' && env.REVIEW_PENDING != '1'
        run: pip install -r requirements-narration.txt
      - name: Narrate published stories with Kokoro
        if: github.event.inputs.dry_run != 'true' && env.REVIEW_PENDING != '1'
        run: python -u -m ygc.narration --site _site --latest-only
      - name: Save generated narration
        uses: actions/cache/save@v4
        if: always() && hashFiles('.cache/narration/recordings/*.mp3') != ''
        with:
          path: .cache/narration
          key: narration-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event.inputs.dry_run != 'true' && env.REVIEW_PENDING != '1'
        with:
          path: _site
      - id: deploy
        if: github.event.inputs.dry_run != 'true' && env.REVIEW_PENDING != '1'
        uses: actions/deploy-pages@v4

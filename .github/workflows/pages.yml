name: Deploy the website

# Rebuilds the site whenever papers or settings change on main: your own edits,
# and merged review pull requests. (The daily job deploys its own runs.)
on:
  push:
    branches: [main]
    paths: ["editions/**", "threads/**", "data/analyst/**", "ygc/**", "assets/**", "site.yaml", "tools/**", "requirements-narration.txt", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg espeak-ng
      - run: pip install -r requirements.txt
      - run: python -m ygc site --out _site
      - name: Restore generated narration
        uses: actions/cache/restore@v4
        with:
          path: .cache/narration
          key: narration-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: narration-v1-${{ runner.os }}-
      - name: Install free narration engine
        run: pip install -r requirements-narration.txt
      - name: Narrate published stories with Kokoro
        run: python -u -m ygc.narration --site _site --latest-only
      - name: Build the app's offline pack (newspebbles.com/app/)
        continue-on-error: true    # the website publishes anyway; phones keep what they saved
        run: bash tools/app_pack.sh
      - name: Save generated narration
        uses: actions/cache/save@v4
        if: always() && hashFiles('.cache/narration/recordings/*.mp3') != ''
        with:
          path: .cache/narration
          key: narration-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub Pages sometimes answers a deployment with a server error (502); wait and try once more.
      - name: Wait before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

name: App parent API
on:
  push:
    paths: ["mobile/**", "assets/app/**", ".github/workflows/app-parent-api.yml"]
  pull_request:
    paths: ["mobile/**", "assets/app/**", ".github/workflows/app-parent-api.yml"]
permissions:
  contents: read
jobs:
  parent-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:parent-api
      - run: npm run typecheck
      - run: npm run lint

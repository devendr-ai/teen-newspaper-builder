name: subscription backend
on:
  push:
    paths: ['subscribe-worker/**', 'tools/dispatch_delivery.py', 'tests/test_dispatch_delivery.py', 'editions/*/edition.yaml', '.github/workflows/subscribe-worker.yml']
  pull_request:
    paths: ['subscribe-worker/**', 'tools/dispatch_delivery.py', 'tests/test_dispatch_delivery.py', 'editions/*/edition.yaml', '.github/workflows/subscribe-worker.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: subscribe-worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: subscribe-worker
      - run: npm test
        working-directory: subscribe-worker
      - run: npm run check
        working-directory: subscribe-worker
      - run: npm run db:local
        working-directory: subscribe-worker
      - run: python -m unittest discover -s tests -p test_dispatch_delivery.py

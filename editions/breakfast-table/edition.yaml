# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt breakfast-table

id: breakfast-table
name: "The Breakfast Table"

masthead:
  title: "THE BREAKFAST TABLE"
  subtitle: DAILY
  tagline: "The day's news, for everyone at the table."
  location: "Washington, USA"

reader:
  age: "9-11"
  profile: "A family reading together at breakfast, youngest about nine."
  reading_level: "Upper elementary. Short sentences. Explain every new word the first time it appears."

purpose:
  - "A shared picture of the day's news for every age at the table."
  - "Something to talk about together."
  - "Calm, accurate understanding of hard news."

voice: "Warm, simple and exact, like a favourite teacher. Honest about hard news without graphic detail."

cadence:
  every_days: 1
  window_hours: 24
  timezone: America/Los_Angeles

style:
  type_scale: 1.25

labels:
  why: "WHY IT MATTERS"
  vocab_title: "New words this time"

teaching:
  repeat_window: 2
  vocab_today: false

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world, United States and India."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: us
    label: "UNITED STATES"
    scope: "The most important story from United States in the window: one that teaches something, not filler."
  - id: india
    label: "INDIA"
    scope: "The most important story from India in the window: one that teaches something, not filler."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, graphics: [chart], extras: [connect]}
  us: {type: story, desk: us, extras: [why], also: {count: 2, title: "Also in United States"}}
  india: {type: story, desk: india, extras: [why]}
  briefs: {type: briefs, count: 2}
  discussion: {type: feature, label: "TALK ABOUT IT", brief: "Three open questions about this issue for discussion at home or in class. Questions only, never answers.", sources: false}
  sports: {type: sports}
  watchlist: {type: watchlist, count: 2, title: "TOMORROW'S WATCHLIST"}
  quote: {type: quote}
  sign_off: {type: sign_off, text: "Keep exploring. See you tomorrow."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  The United States and India"
    columns:
      - [us, briefs, discussion]
      - [india, rule, sports, watchlist, quote, sign_off]

rules:
  - "4 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give each story enough context that the reader could explain it to someone else."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow Science and Tech: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
site:
  focus: "Family"
  blurb: "A daily family paper: calm, accurate news with something to talk about together."

# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt little-explorers

id: little-explorers
name: "The Little Explorer"

masthead:
  title: "THE LITTLE EXPLORER"
  subtitle: WEEKLY
  tagline: "The day's news, for everyone at the table."
  location: "Washington, USA"

reader:
  age: "6-8"
  profile: "A curious six-to-eight-year-old, reading with a grown-up at the weekend."
  reading_level: "Early reader (grades 1–3). Very short sentences, one idea each. Explain every new word."

purpose:
  - "A shared picture of the day's news for every age at the table."
  - "Something to talk about together."
  - "Calm, accurate understanding of hard news."

voice: "Warm, gentle and concrete, like reading aloud together. Honest about sad news but never frightening or graphic: say what happened and who is helping."

cadence:
  every_days: 7
  window_hours: 168
  timezone: America/Los_Angeles

style:
  type_scale: 1.35

labels:
  why: "WHY IT MATTERS"
  vocab_title: "New words this time"

teaching:
  repeat_window: 4
  vocab_today: true

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world and United States."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: us
    label: "UNITED STATES"
    scope: "The most important story from United States in the window: one that teaches something, not filler."
  - id: science_and_technology
    label: "SCIENCE & TECH"
    scope: "The most significant discovery, research result or technology development of the window."
    rules:
      - "Prefer peer-reviewed findings and official data over company announcements."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, graphics: [illustration], extras: [why]}
  us: {type: story, desk: us, graphics: [chart], extras: [why]}
  science_and_technology: {type: story, desk: science_and_technology, extras: [why]}
  briefs: {type: briefs, count: 2}
  vocab: {type: vocab, count: 3}
  sign_off: {type: sign_off, text: "Keep exploring. See you next week."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  The United States and Science and Tech"
    columns:
      - [us, briefs]
      - [science_and_technology, vocab, rule, sign_off]

rules:
  - "4 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Keep each story to its essentials: what happened, the key numbers and why it matters."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow Climate and Environment: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
  weekday: saturday
site:
  focus: "Science and nature"
  blurb: "Two gentle pages a week: a big story, a science wonder and new words, for ages 6–8 reading with a grown-up."

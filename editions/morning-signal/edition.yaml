# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt morning-signal

id: morning-signal
name: "The Morning Signal"

masthead:
  title: "THE MORNING SIGNAL"
  subtitle: DAILY
  tagline: "What changed, and what it means."
  location: "Seattle, USA"

reader:
  age: "adult professional"
  profile: "A professional who needs the implications, not the basics."
  reading_level: "Specialist. Assume domain knowledge; never explain the basics."

purpose:
  - "What changed in the window and what it means for decisions."
  - "Quantified implications for markets, policy and operations."
  - "Early signals worth monitoring."

voice: "Concise and decision-oriented. Lead with implications, quantify where possible, flag uncertainty explicitly."

cadence:
  every_days: 1
  window_hours: 24
  timezone: America/Los_Angeles

style:
  type_scale: 0.9

labels:
  why: "WHAT IT MEANS"
  analyst: "WHAT TO WATCH FOR"
  briefs: "IN BRIEF"

teaching:
  repeat_window: 2
  vocab_today: false

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world, United States and China."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: us
    label: "UNITED STATES"
    scope: "The most important story from United States in the window: one that teaches something, not filler."
  - id: china
    label: "CHINA"
    scope: "The most important story from China in the window: one that teaches something, not filler."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, graphics: [illustration], extras: [why]}
  us: {type: story, desk: us, graphics: [chart], extras: [why]}
  china: {type: story, desk: china, graphics: [illustration], extras: [why], also: {count: 2, title: "Also in China"}}
  briefs: {type: briefs, count: 2}
  watchlist: {type: watchlist, count: 2, title: "TOMORROW'S WATCHLIST"}
  sign_off: {type: sign_off, text: "Thanks for reading. See you tomorrow."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  The United States and China"
    columns:
      - [us, briefs]
      - [china, rule, watchlist, sign_off]

rules:
  - "4 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Keep each story to its essentials: what happened, the key numbers and why it matters."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow Business and Markets, Economy and Science and Tech: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
site:
  focus: "Business and markets"
  blurb: "Two pages before your first meeting: what changed, and what it means."

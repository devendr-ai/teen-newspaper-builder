# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt asia-watch

id: asia-watch
name: "Asia Watch"

masthead:
  title: "ASIA WATCH"
  subtitle: WEEKLY
  tagline: "What changed, and what it means."
  location: "Seattle, USA"

reader:
  age: "adult"
  profile: "A professional who follows Asia's economies and politics."
  reading_level: "General adult reader."

purpose:
  - "What changed in the window and what it means for decisions."
  - "Quantified implications for markets, policy and operations."
  - "Early signals worth monitoring."

voice: "Plain, precise and fair-minded. Respect the reader's time: lead with what changed and why it matters."

cadence:
  every_days: 7
  window_hours: 168
  timezone: America/Los_Angeles

style:
  type_scale: 0.95

labels:
  why: "WHAT IT MEANS"
  analyst: "WHAT TO WATCH FOR"
  briefs: "IN BRIEF"

teaching:
  repeat_window: 4
  vocab_today: false

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from China, Japan, India and Australia."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: china
    label: "CHINA"
    scope: "The most important story from China in the window: one that teaches something, not filler."
  - id: japan
    label: "JAPAN"
    scope: "The most important story from Japan in the window: one that teaches something, not filler."
  - id: india
    label: "INDIA"
    scope: "The most important story from India in the window: one that teaches something, not filler."
  - id: australia
    label: "AUSTRALIA"
    scope: "The most important story from Australia in the window: one that teaches something, not filler."
  - id: business_and_markets
    label: "BUSINESS & MARKETS"
    scope: "The most consequential company, industry or market development of the window."
  - id: economics
    label: "ECONOMY"
    scope: "The economic story with the widest effect on households: prices, jobs, trade, interest rates or public money."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [illustration], extras: [why]}
  china: {type: story, desk: china, graphics: [illustration], extras: [connect]}
  japan: {type: story, desk: japan, graphics: [illustration], extras: [why]}
  india: {type: story, desk: india, graphics: [illustration], extras: [why]}
  australia: {type: story, desk: australia, graphics: [illustration], extras: [why]}
  business_and_markets: {type: story, desk: business_and_markets, graphics: [chart], extras: [why, analyst]}
  economics: {type: story, desk: economics, graphics: [illustration], extras: [why]}
  briefs: {type: briefs, count: 4}
  analysis: {type: feature, label: "THE BIG PICTURE", brief: "Analysis connecting several of this issue's stories, with the evidence and the strongest competing perspectives."}
  watchlist: {type: watchlist, count: 3, title: "COMING UP"}
  sign_off: {type: sign_off, text: "Thanks for reading. See you next week."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [china]
  - banner: "<b>PAGE 2</b>  •  Japan and India"
    columns:
      - [japan]
      - [india]
  - banner: "<b>PAGE 3</b>  •  Australia and Business and Markets"
    columns:
      - [australia]
      - [business_and_markets]
  - banner: "<b>PAGE 4</b>  •  Briefing"
    columns:
      - [economics]
      - [briefs, analysis, watchlist, sign_off]

rules:
  - "7 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give each story enough context that the reader could explain it to someone else."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."

# Website and automatic publishing
automation:
  enabled: true
  weekday: friday
site:
  focus: "Business and markets"
  blurb: "A weekly four-page brief on Asia's politics, markets and business."

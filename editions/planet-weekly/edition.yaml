# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt planet-weekly

id: planet-weekly
name: "Planet Weekly"

masthead:
  title: "PLANET"
  subtitle: WEEKLY
  tagline: "The news, connected to what you learn."
  location: "Washington, USA"

reader:
  age: "15-18"
  profile: "A teenager who cares about climate and the planet."
  reading_level: "High school. Adult news vocabulary, with technical terms defined on first use."

purpose:
  - "Connections between the news and school subjects: history, geography, science, civics and economics."
  - "Confident use of subject vocabulary."
  - "Questions worth discussing in class."

voice: "Direct and analytical. Show the evidence, name the trade-offs and present competing arguments fairly."

cadence:
  every_days: 7
  window_hours: 168
  timezone: America/Los_Angeles

style:
  type_scale: 0.95

teaching:
  repeat_window: 4
  vocab_today: true

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: climate_and_environment
    label: "CLIMATE & ENVIRONMENT"
    scope: "The most significant climate, weather or environmental story, with evidence and scale."
  - id: science_and_technology
    label: "SCIENCE & TECH"
    scope: "The most significant discovery, research result or technology development of the window."
    rules:
      - "Prefer peer-reviewed findings and official data over company announcements."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, graphics: [chart], extras: [connect]}
  climate_and_environment: {type: story, desk: climate_and_environment, extras: [why]}
  science_and_technology: {type: story, desk: science_and_technology, extras: [why]}
  briefs: {type: briefs, count: 2}
  vocab: {type: vocab, count: 4}
  did_you_know: {type: did_you_know}
  explainer: {type: feature, label: "EXPLAINER", brief: "Background behind one of this issue's stories, from well-established facts.", sources: false}
  quote: {type: quote}
  sign_off: {type: sign_off, text: "You are not just reading the news — you are learning to think about it. See you next week."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  Climate and Environment and Science and Tech"
    columns:
      - [climate_and_environment, briefs, vocab, did_you_know]
      - [science_and_technology, explainer, rule, quote, sign_off]

rules:
  - "4 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give each story enough context that the reader could explain it to someone else."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow Health: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
  weekday: sunday
site:
  focus: "Science and nature"
  blurb: "The week in climate, environment and health science, with the evidence explained."

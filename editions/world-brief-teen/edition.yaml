# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt world-brief-teen

id: world-brief-teen
name: "The World Brief"

masthead:
  title: "THE WORLD BRIEF"
  subtitle: DAILY
  tagline: "News that helps you think like a global thinker."
  location: "Washington, USA"

reader:
  age: "15-18"
  profile: "A high-school student who wants to understand the world, not just follow it."
  reading_level: "High school. Adult news vocabulary, with technical terms defined on first use."

purpose:
  - "Strong general knowledge of the world and the regions it covers."
  - "Early political and economic awareness."
  - "Curiosity and independent thinking."
  - "The habit of connecting events to history, geography and cause and effect."

voice: "Direct and analytical. Show the evidence, name the trade-offs and present competing arguments fairly."

cadence:
  every_days: 1
  window_hours: 24
  timezone: America/Los_Angeles

style:
  type_scale: 0.95

teaching:
  repeat_window: 2
  vocab_today: true

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world, United States, United Kingdom, Europe and China."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: us
    label: "UNITED STATES"
    scope: "The most important story from United States in the window: one that teaches something, not filler."
  - id: uk
    label: "UNITED KINGDOM"
    scope: "The most important story from United Kingdom in the window: one that teaches something, not filler."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why, analyst]}
  world: {type: story, desk: world, graphics: [illustration], extras: [connect]}
  us: {type: story, desk: us, extras: [why, analyst], also: {count: 2, title: "Also in United States"}}
  uk: {type: story, desk: uk, graphics: [chart], extras: [why, analyst]}
  briefs: {type: briefs, count: 2}
  vocab: {type: vocab, count: 4}
  did_you_know: {type: did_you_know}
  sports: {type: sports}
  watchlist: {type: watchlist, count: 2, title: "TOMORROW'S WATCHLIST"}
  quote: {type: quote}
  sign_off: {type: sign_off, text: "You are not just reading the news — you are learning to think about it. See you tomorrow."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  The United States and the United Kingdom"
    columns:
      - [us, briefs, vocab, did_you_know]
      - [uk, rule, sports, watchlist, quote, sign_off]

rules:
  - "4 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give background, the evidence behind each claim, and the strongest version of each competing perspective."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow Europe, China, Politics and Civics and Economy: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
site:
  focus: "World affairs"
  blurb: "A daily two-page briefing for teens, with the evidence and the competing arguments."

# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt lab-notebook

id: lab-notebook
name: "The Lab Notebook"

masthead:
  title: "THE LAB NOTEBOOK"
  subtitle: WEEKLY
  tagline: "The news, connected to what you learn."
  location: "Washington, USA"

reader:
  age: "12-14"
  profile: "A science-curious middle-schooler."
  reading_level: "Elevated middle school. Never childish; explain without dumbing down."

purpose:
  - "Connections between the news and school subjects: history, geography, science, civics and economics."
  - "Confident use of subject vocabulary."
  - "Questions worth discussing in class."

voice: "Clear, engaging and intelligent. Use analogies a middle-schooler knows. Where people genuinely disagree, give each side in its own terms."

cadence:
  every_days: 7
  window_hours: 168
  timezone: America/Los_Angeles

style:
  type_scale: 1

teaching:
  repeat_window: 4
  vocab_today: true

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: science_and_technology
    label: "SCIENCE & TECH"
    scope: "The most significant discovery, research result or technology development of the window."
    rules:
      - "Prefer peer-reviewed findings and official data over company announcements."
  - id: climate_and_environment
    label: "CLIMATE & ENVIRONMENT"
    scope: "The most significant climate, weather or environmental story, with evidence and scale."
  - id: health
    label: "HEALTH"
    scope: "The most significant public-health or medical-science story, reported with care and evidence."
  - id: history_and_geography
    label: "HISTORY & GEOGRAPHY"
    scope: "A current story whose roots in history or geography are worth explaining."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, graphics: [illustration], extras: [connect]}
  science_and_technology: {type: story, desk: science_and_technology, graphics: [illustration], extras: [why]}
  climate_and_environment: {type: story, desk: climate_and_environment, graphics: [illustration], extras: [why]}
  health: {type: story, desk: health, graphics: [illustration], extras: [why]}
  history_and_geography: {type: story, desk: history_and_geography, graphics: [chart], extras: [why, analyst]}
  briefs: {type: briefs, count: 4}
  vocab: {type: vocab, count: 4}
  did_you_know: {type: did_you_know}
  explainer: {type: feature, label: "EXPLAINER", brief: "Background behind one of this issue's stories, from well-established facts.", sources: false}
  quiz: {type: feature, label: "QUIZ", brief: "5 multiple-choice questions on this issue, with the answers at the end.", sources: false}
  discussion: {type: feature, label: "DISCUSS", brief: "Three open questions about this issue for discussion at home or in class. Questions only, never answers.", sources: false}
  quote: {type: quote}
  sign_off: {type: sign_off, text: "You are not just reading the news — you are learning to think about it. See you next week."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  Science and Tech and Climate and Environment"
    columns:
      - [science_and_technology]
      - [climate_and_environment]
  - banner: "<b>PAGE 3</b>  •  Health and History and Geography"
    columns:
      - [health]
      - [history_and_geography]
  - banner: "<b>PAGE 4</b>  •  Your toolkit"
    columns:
      - [briefs, vocab, did_you_know, explainer]
      - [quiz, discussion, rule, quote, sign_off]

rules:
  - "6 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give each story enough context that the reader could explain it to someone else."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."

# Website and automatic publishing
automation:
  enabled: true
  weekday: saturday
site:
  focus: "Science and nature"
  blurb: "A weekly science paper: discoveries, climate, health and the history behind them, with a quiz."

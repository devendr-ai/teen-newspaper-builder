# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt the-bridge

id: the-bridge
name: "The Bridge"

masthead:
  title: "THE BRIDGE"
  tagline: "News that helps you think like a global thinker."
  location: "Washington, USA"

reader:
  age: "adult"
  profile: "An Indian-American adult following both countries."
  reading_level: "General adult reader."

purpose:
  - "Strong general knowledge of the world and the regions it covers."
  - "Early political and economic awareness."
  - "Curiosity and independent thinking."
  - "The habit of connecting events to history, geography and cause and effect."

voice: "Plain, precise and fair-minded. Respect the reader's time: lead with what changed and why it matters."

cadence:
  every_days: 2
  window_hours: 48
  timezone: America/Los_Angeles

style:
  type_scale: 0.95

teaching:
  repeat_window: 2
  vocab_today: true

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world, India and United States."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: india
    label: "INDIA"
    scope: "The most important story from India in the window: one that teaches something, not filler."
  - id: us
    label: "UNITED STATES"
    scope: "The most important story from United States in the window: one that teaches something, not filler."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, graphics: [illustration], extras: [connect]}
  india: {type: story, desk: india, graphics: [illustration], extras: [why], also: {count: 2, title: "Also in India"}}
  us: {type: story, desk: us, graphics: [chart], extras: [why, analyst]}
  briefs: {type: briefs, count: 2}
  vocab: {type: vocab, count: 3}
  did_you_know: {type: did_you_know}
  sports: {type: sports}
  watchlist: {type: watchlist, count: 2, title: "WHAT TO WATCH NEXT"}
  quote: {type: quote}
  sign_off: {type: sign_off, text: "Thanks for reading. See you in two days."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  India and the United States"
    columns:
      - [india, briefs, vocab, did_you_know]
      - [us, rule, sports, watchlist, quote, sign_off]

rules:
  - "4 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give each story enough context that the reader could explain it to someone else."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow Economy and Business and Markets: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
site:
  focus: "India and the US"
  blurb: "India and the United States, side by side, every two days: politics, economy and the ties between them."

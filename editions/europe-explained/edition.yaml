# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt europe-explained

id: europe-explained
name: "Europe Explained"

masthead:
  title: "EUROPE EXPLAINED"
  tagline: "News that helps you think like a global thinker."
  location: "London, UK"

reader:
  age: "12-14"
  profile: "A middle-schooler in the UK or Europe."
  reading_level: "Elevated middle school. Never childish; explain without dumbing down."

purpose:
  - "Strong general knowledge of the world and the regions it covers."
  - "Early political and economic awareness."
  - "Curiosity and independent thinking."
  - "The habit of connecting events to history, geography and cause and effect."

voice: "Clear, engaging and intelligent. Use analogies a middle-schooler knows. Where people genuinely disagree, give each side in its own terms."

# This paper's angle when a story also runs in other papers the same day (docs/ANGLES.md).
lens: "How it reaches the UK and Europe: European governments, prices and people."

cadence:
  every_days: 2
  window_hours: 48
  timezone: Europe/London

style:
  type_scale: 1

teaching:
  repeat_window: 2
  vocab_today: true

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world, United Kingdom and Europe."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: uk
    label: "UNITED KINGDOM"
    scope: "The most important story from United Kingdom in the window: one that teaches something, not filler."
  - id: europe
    label: "EUROPE"
    scope: "The most important story from Europe in the window: one that teaches something, not filler."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, graphics: [illustration], extras: [connect]}
  uk: {type: story, desk: uk, extras: [why], also: {count: 2, title: "Also in United Kingdom"}}
  europe: {type: story, desk: europe, graphics: [chart], extras: [why, analyst]}
  briefs: {type: briefs, count: 2}
  vocab: {type: vocab, count: 4}
  did_you_know: {type: did_you_know}
  sports: {type: sports}
  watchlist: {type: watchlist, count: 2, title: "WHAT TO WATCH NEXT"}
  quote: {type: quote}
  sign_off: {type: sign_off, text: "You are not just reading the news — you are learning to think about it. See you in two days."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  The United Kingdom and Europe"
    columns:
      - [uk, briefs, vocab, did_you_know]
      - [europe, rule, sports, watchlist, quote, sign_off]

rules:
  - "4 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give each story enough context that the reader could explain it to someone else."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow Politics and Civics and Science and Tech: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
site:
  focus: "World affairs"
  blurb: "The UK, Europe and the world for ages 12–14, every two days."

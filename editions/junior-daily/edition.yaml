# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt junior-daily

id: junior-daily
name: "The Junior Daily"

masthead:
  title: "THE JUNIOR"
  subtitle: DAILY
  tagline: "News that helps you think like a global thinker."
  location: "Washington, USA"

reader:
  age: "9-11"
  profile: "A curious nine-to-eleven-year-old who reads before school."
  reading_level: "Upper elementary. Short sentences. Explain every new word the first time it appears."

purpose:
  - "Strong general knowledge of the world and the regions it covers."
  - "Early political and economic awareness."
  - "Curiosity and independent thinking."
  - "The habit of connecting events to history, geography and cause and effect."

voice: "Warm, simple and exact, like a favourite teacher. Honest about hard news without graphic detail."

# This paper's angle when a story also runs in other papers the same day (docs/ANGLES.md).
lens: "Where in the world and who is involved: the places, the people, and how far away it is."

cadence:
  every_days: 1
  window_hours: 24
  timezone: America/Los_Angeles

style:
  type_scale: 1.25

labels:
  why: "WHY IT MATTERS"
  vocab_title: "New words this time"

teaching:
  repeat_window: 2
  vocab_today: false

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world and United States."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, size: compact, graphics: [chart], extras: [why]}
  briefs: {type: briefs, count: 2}
  watchlist: {type: watchlist, count: 2, title: "TOMORROW'S WATCHLIST"}
  sign_off: {type: sign_off, text: "Keep exploring. See you tomorrow."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world, briefs, watchlist, sign_off]

rules:
  - "2 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Keep each story to its essentials: what happened, the key numbers and why it matters."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow the United States: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
site:
  focus: "World affairs"
  blurb: "The day's two biggest stories on one page, explained for ages 9–11."

# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt global-ledger

id: global-ledger
name: "The Global Ledger"

masthead:
  title: "THE GLOBAL LEDGER"
  subtitle: WEEKLY
  tagline: "News that helps you think like a global thinker."
  location: "Washington, USA"

reader:
  age: "adult"
  profile: "An adult who wants the week's world news in depth."
  reading_level: "General adult reader."

purpose:
  - "Strong general knowledge of the world and the regions it covers."
  - "Early political and economic awareness."
  - "Curiosity and independent thinking."
  - "The habit of connecting events to history, geography and cause and effect."

voice: "Plain, precise and fair-minded. Respect the reader's time: lead with what changed and why it matters."

cadence:
  every_days: 7
  window_hours: 168
  timezone: America/Los_Angeles

style:
  type_scale: 0.95

teaching:
  repeat_window: 4
  vocab_today: false

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world, United States, United Kingdom, Europe, China and Middle East."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: us
    label: "UNITED STATES"
    scope: "The most important story from United States in the window: one that teaches something, not filler."
  - id: uk
    label: "UNITED KINGDOM"
    scope: "The most important story from United Kingdom in the window: one that teaches something, not filler."
  - id: europe
    label: "EUROPE"
    scope: "The most important story from Europe in the window: one that teaches something, not filler."
  - id: china
    label: "CHINA"
    scope: "The most important story from China in the window: one that teaches something, not filler."
  - id: middle_east
    label: "MIDDLE EAST"
    scope: "The most important story from Middle East in the window: one that teaches something, not filler."
  - id: politics_and_civics
    label: "POLITICS & CIVICS"
    scope: "How power and government work, shown through the window's most important political story."
  - id: economics
    label: "ECONOMY"
    scope: "The economic story with the widest effect on households: prices, jobs, trade, interest rates or public money."
  - id: business_and_markets
    label: "BUSINESS & MARKETS"
    scope: "The most consequential company, industry or market development of the window."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why, analyst]}
  world: {type: story, desk: world, graphics: [illustration], extras: [connect]}
  us: {type: story, desk: us, graphics: [chart], extras: [why, analyst]}
  uk: {type: story, desk: uk, graphics: [illustration], extras: [why]}
  europe: {type: story, desk: europe, graphics: [illustration], extras: [why, analyst]}
  china: {type: story, desk: china, graphics: [illustration], extras: [why]}
  middle_east: {type: story, desk: middle_east, graphics: [illustration], extras: [why, analyst]}
  politics_and_civics: {type: story, desk: politics_and_civics, graphics: [illustration], extras: [why]}
  economics: {type: story, desk: economics, graphics: [illustration], extras: [why, analyst]}
  business_and_markets: {type: story, desk: business_and_markets, graphics: [illustration], extras: [why]}
  briefs: {type: briefs, count: 5}
  did_you_know: {type: did_you_know}
  explainer: {type: feature, label: "EXPLAINER", brief: "Background behind one of this issue's stories, from well-established facts.", sources: false}
  analysis: {type: feature, label: "THE BIG PICTURE", brief: "Analysis connecting several of this issue's stories, with the evidence and the strongest competing perspectives."}
  watchlist: {type: watchlist, count: 3, title: "COMING UP"}
  quote: {type: quote}
  sign_off: {type: sign_off, text: "Thanks for reading. See you next week."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  The United States and the United Kingdom"
    columns:
      - [us]
      - [uk]
  - banner: "<b>PAGE 3</b>  •  Europe and China"
    columns:
      - [europe]
      - [china]
  - banner: "<b>PAGE 4</b>  •  The Middle East and Politics and Civics"
    columns:
      - [middle_east]
      - [politics_and_civics]
  - banner: "<b>PAGE 5</b>  •  Economy and Business and Markets"
    columns:
      - [economics]
      - [business_and_markets]
  - banner: "<b>PAGE 6</b>  •  Your toolkit"
    columns:
      - [briefs, did_you_know, explainer]
      - [analysis, rule, watchlist, quote, sign_off]

rules:
  - "10 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give background, the evidence behind each claim, and the strongest version of each competing perspective."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."

# Website and automatic publishing
automation:
  enabled: true
  weekday: sunday
site:
  focus: "World affairs"
  blurb: "Six pages every week: the world's biggest stories in depth, with analysis and an explainer."

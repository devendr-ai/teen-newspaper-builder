# yaml-language-server: $schema=../../schema/edition.schema.json
# Generated by the ygc configurator. Edit freely, then run:
#   python -m ygc editions && python -m ygc prompt current-affairs-digest

id: current-affairs-digest
name: "The Current Affairs Digest"

masthead:
  title: "THE CURRENT AFFAIRS DIGEST"
  subtitle: DAILY
  tagline: "The news you need to know, and remember."
  location: "New Delhi, India"

reader:
  age: "15-18"
  profile: "A student preparing for Indian competitive and board exams."
  reading_level: "High school. Adult news vocabulary, with technical terms defined on first use."

purpose:
  - "Facts worth remembering: names, dates, places and numbers, stated precisely."
  - "Understanding of why events matter, not just what happened."
  - "Regular self-testing through quizzes."

voice: "Direct and analytical. Show the evidence, name the trade-offs and present competing arguments fairly."

cadence:
  every_days: 1
  window_hours: 24
  timezone: Asia/Kolkata

style:
  type_scale: 0.95

teaching:
  repeat_window: 2
  vocab_today: true

sources_required: true

desks:
  - id: top
    label: "TOP STORY"
    scope: "The single most important story of the window for this reader, from the world and India."
    rules:
      - "If a running story is still the biggest, it leads again, written as the new development."
  - id: world
    label: "WORLD"
    scope: "The next most important world story, from a region or field the lead doesn't cover."
  - id: india
    label: "INDIA"
    scope: "The most important story from India in the window: one that teaches something, not filler."
  - id: politics_and_civics
    label: "POLITICS & CIVICS"
    scope: "How power and government work, shown through the window's most important political story."
  - id: economics
    label: "ECONOMY"
    scope: "The economic story with the widest effect on households: prices, jobs, trade, interest rates or public money."
  - id: science_and_technology
    label: "SCIENCE & TECH"
    scope: "The most significant discovery, research result or technology development of the window."
    rules:
      - "Prefer peer-reviewed findings and official data over company announcements."

blocks:
  lead: {type: story, desk: top, size: lead, graphics: [map], extras: [why]}
  world: {type: story, desk: world, graphics: [illustration], extras: [connect]}
  india: {type: story, desk: india, graphics: [illustration], extras: [why]}
  politics_and_civics: {type: story, desk: politics_and_civics, graphics: [illustration], extras: [why]}
  economics: {type: story, desk: economics, graphics: [chart], extras: [why, analyst]}
  science_and_technology: {type: story, desk: science_and_technology, graphics: [illustration], extras: [why]}
  briefs: {type: briefs, count: 4}
  vocab: {type: vocab, count: 4}
  did_you_know: {type: did_you_know}
  explainer: {type: feature, label: "EXPLAINER", brief: "Background behind one of this issue's stories, from well-established facts.", sources: false}
  quiz: {type: feature, label: "QUIZ", brief: "8 multiple-choice questions on this issue, with the answers at the end.", sources: false}
  watchlist: {type: watchlist, count: 3, title: "TOMORROW'S WATCHLIST"}
  sign_off: {type: sign_off, text: "You are not just reading the news — you are learning to think about it. See you tomorrow."}

pages:
  - masthead: true
    columns:
      - [lead]
      - [world]
  - banner: "<b>PAGE 2</b>  •  India and Politics and Civics"
    columns:
      - [india]
      - [politics_and_civics]
  - banner: "<b>PAGE 3</b>  •  Economy and Science and Tech"
    columns:
      - [economics]
      - [science_and_technology]
  - banner: "<b>PAGE 4</b>  •  Your toolkit"
    columns:
      - [briefs, vocab, did_you_know, explainer]
      - [quiz, rule, watchlist, sign_off]

rules:
  - "6 stories per issue, one per story block, each chosen on news value against its desk's scope."
  - "Give each story enough context that the reader could explain it to someone else."
  - "Age and purpose change vocabulary, explanation and emphasis, never the standard of accuracy or sourcing."
  - "Graphics are formatting requirements, not selection criteria: choose the story first, then fit the graphic."
  - "Also follow History and Geography: cover them in briefs, or as angles within other stories, when the news warrants."

# Website and automatic publishing
automation:
  enabled: true
site:
  focus: "Exam preparation"
  blurb: "Daily current affairs for Indian exam preparation: precise facts, key terms and an 8-question quiz."

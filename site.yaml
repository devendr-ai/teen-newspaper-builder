# Website settings for `python -m ygc site` (and the daily publishing workflow).
title: News Pebbles
tagline: Big news, small pebbles.
home_headline: Help your child understand the world in 15 minutes a day.
description: Free, age-appropriate newspapers to print, read and talk about together. From sources you can check.
domain: newspebbles.com
base_url: https://newspebbles.com/
contact: ""            # an email address readers can send corrections to
goatcounter: "newspebbles"       # privacy-first visit counts (ygc/stats.py): the code of a GoatCounter site, e.g. newspebbles for newspebbles.goatcounter.com
feedback_url: "https://docs.google.com/forms/d/e/1FAIpQLSckp1619w9UDFaGy_9gz3JkTRdAdNJ5DjxUOpWPGn7X3FWO4Q/viewform"   # a Google Form (or any form) link: adds a Feedback tab and footer link
keep_issues: 30        # how many past issues per paper stay downloadable
qr_from: "2026-10-16"  # papers from this date print a QR code that opens them in Read & Play

# The box at the top of the home page, written for parents.
intro_title: Get your child into the news, on paper
intro: >-
  Most news isn't written for children, and a phone feed isn't where you want them to meet it.
  Each paper here is written for one age group: short, calm and accurate, honest about hard news
  without graphic detail, and built only from sources you can check.
steps:
  - Pick your child's age below.
  - Download the latest PDF and print it on US Letter paper.
  - Leave it on the breakfast table, then talk about it together.

# Website settings for `python -m ygc site` (and the daily publishing workflow).
title: News Pebbles
tagline: Big news, small pebbles.
home_headline: Help your child understand the world in 15 minutes a day.
home_ritual: Print it. Leave it at breakfast. Discover something together.
home_photo:
  image: breakfast-table.webp
  alt: The Little Explorer printed on a breakfast table beside a bowl of cereal.
description: Free, age-appropriate newspapers to print, read and talk about together. From sources you can check.
domain: newspebbles.com
base_url: https://newspebbles.com/
publisher: NeRDLabs    # who makes News Pebbles: How it's made, Terms and every page's footer
corrections_email: corrections@newspebbles.com   # printed in every page's footer of the papers (a forwarding address)
contact: corrections@newspebbles.com   # where readers send corrections, on the website
info_email: info@newspebbles.com       # general questions: footer, How it's made, Terms
privacy_email: privacy@newspebbles.com # the Privacy page
license: CC BY-NC 4.0  # what people may do with the papers: Terms and every page's footer
goatcounter: "newspebbles"       # privacy-first visit counts (ygc/stats.py): the code of a GoatCounter site, e.g. newspebbles for newspebbles.goatcounter.com
feedback_url: "https://docs.google.com/forms/d/e/1FAIpQLSckp1619w9UDFaGy_9gz3JkTRdAdNJ5DjxUOpWPGn7X3FWO4Q/viewform"   # a Google Form (or any form) link: adds a Feedback tab and footer link
keep_issues: 30        # how many past issues per paper stay downloadable
qr_from: "2026-10-16"  # papers from this date print a QR code that opens them in Read & Play

# The box at the top of the home page, written for parents.
intro_title: Get your child into the news, on paper
intro: >-
  Most news isn't written for children, and a phone feed isn't where you want them to meet it.
  Each paper here is written for one age group: short, calm and accurate, honest about hard news
  without graphic detail, and built only from sources you can check.
steps:
  - Pick your child's age below.
  - Download the latest PDF and print it on US Letter paper.
  - Leave it on the breakfast table, then talk about it together.

# Email UI stays hidden until Phase 1 is deployed and verified.
subscriptions:
  enabled: true
  # Worker origin (adds /api) or API base, e.g. https://newspebbles.com/api.
  api_base_url: "https://newspebbles-subscribe.devendr.workers.dev"
  # Add an official https://whatsapp.com/channel/... URL when ready.
  whatsapp_channel_url: ""

# Shared analyst responses: no request before a reader explicitly shares.
analyst_games:
  api_base_url: "https://newspebbles-subscribe.devendr.workers.dev"

# Website downloads only. Emails continue to receive the regular news PDF.
weekend_puzzles:
  enabled: true

# Public website showcase only. Leave blank until each store approves its listing.
# These URLs never appear in the --kids / installed-app build.
mobile_app:
  app_store_url: ""
  google_play_url: ""
